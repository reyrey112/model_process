version: '3.8'

services:
  nginx:
    image: nginx:stable
    ports: ["80:80", "443:443"]     # the only published ports
    depends_on: [frontend, api]

  frontend:
    build: ./frontend
    expose: ["3000"]                # reachable by other containers, not the host/internet
    environment:
      API_BASE_URL: http://api:8000

  api:
    build: ./api
    expose: ["8000"]
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on: [db]

  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_secure_password
      - POSTGRES_DB=timeseries_db
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: always

volumes:
  timescaledb_data: