version: '3.8'

services:
  # nginx:
  #   image: nginx:stable
  #   ports: ["80:80", "443:443"]     # the only published ports
  #   depends_on: [frontend, backend]

  # frontend:
  #   build: ./frontend
  #   expose: ["3000"]                # reachable by other containers, not the host/internet
  #   environment:
  #     API_BASE_URL: "http:${API_BASE}"

  backend:
    build: ./backend
    expose: ["${FASTAPI_PORT}"]
    depends_on: [db]

  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: always

volumes:
  timescaledb_data: